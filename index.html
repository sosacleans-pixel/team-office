<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Team Salim · Virtual Office</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Team Salim <span>·</span> Virtual Office</h1>
    <p id="updated" class="updated">Loading status…</p>
  </div>
  <div id="summary" class="summary" role="status" aria-label="Status summary"></div>
</header>
<nav class="filters" aria-label="Filters">
  <div id="statusChips" class="chips" role="group" aria-label="Filter by status"></div>
  <div id="deptChips" class="chips" role="group" aria-label="Filter by department"></div>
</nav>
<main>
  <div id="error" class="error" hidden></div>
  <div id="floor" class="floor" role="region" aria-label="Office floor plan"></div>
</main>
<div id="scrim" class="scrim" hidden></div>
<div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <button type="button" class="close" id="pClose" aria-label="Close panel">×</button>
  <div class="phead">
    <img id="pAvatar" src="data:," alt="" width="64" height="64">
    <div><h2 id="pTitle">Bot</h2><p id="pRole" class="prole"></p><p id="pMeta"></p></div>
  </div>
  <p id="pTask" class="ptask"></p>
  <div id="pLists"></div>
</div>
<footer class="foot">Private team dashboard · data from status.json</footer>
<script src="app.js"></script>
</body>
</html>
